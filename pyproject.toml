[project]
name = "msc-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.116.0",
    "chromadb>=1.5.9",
    "datasets>=5.0.0",
    "fastapi>=0.139.0",
    "google-genai>=2.11.0",
    "langchain-anthropic>=1.4.8",
    "langchain-community<0.4",
    "langchain-huggingface>=1.2.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas==0.3.9",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "statsmodels>=0.14.6",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_metrics.py"]
pythonpath = ["."]